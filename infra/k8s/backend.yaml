apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads-pvc
  labels:
    app: vellvista-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app: vellvista-backend
data:
  PORT: "3001"
  SERVER_IP: "vellvista.local"
  FRONTEND_URL: "http://vellvista.local"
  BETTER_AUTH_URL: "http://vellvista.local"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  labels:
    app: vellvista-backend
type: Opaque
data:
  # Base64 encoded connection string: postgresql://postgres:postgres@postgres:5432/vellvista
  DATABASE_URL: cG9zdGdyZXNxbDovL3Bvc3RncmVzOnBvc3RncmVzQHBvc3RncmVzOjU0MzIvdmVsbHZpc3Rh
  # Base64 encoded secret: dev_secret_key_which_is_at_least_32_characters_long
  BETTER_AUTH_SECRET: ZGV2X3NlY3JldF9rZXlfd2hpY2hfaXNfYXRfbGVhc3RfMzJfY2hhcmFjdGVyc19sb25n
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: vellvista-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vellvista-backend
  template:
    metadata:
      labels:
        app: vellvista-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: vellvista-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: BETTER_AUTH_SECRET
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: PORT
            - name: SERVER_IP
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: SERVER_IP
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: FRONTEND_URL
            - name: BETTER_AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: BETTER_AUTH_URL
          volumeMounts:
            - name: uploads-volume
              mountPath: /app/backend/public
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: backend-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: vellvista-backend
spec:
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: vellvista-backend
  type: ClusterIP

