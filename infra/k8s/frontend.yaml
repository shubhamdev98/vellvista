apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  labels:
    app: vellvista-frontend
data:
  PORT: "3000"
  NEXT_PUBLIC_BACKEND_URL: "http://vellvista.local"
  INTERNAL_BACKEND_URL: "http://backend:3001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: vellvista-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vellvista-frontend
  template:
    metadata:
      labels:
        app: vellvista-frontend
    spec:
      containers:
        - name: frontend
          image: vellvista-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: PORT
            - name: NEXT_PUBLIC_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: NEXT_PUBLIC_BACKEND_URL
            - name: INTERNAL_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: INTERNAL_BACKEND_URL
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: vellvista-frontend
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: vellvista-frontend
  type: ClusterIP
