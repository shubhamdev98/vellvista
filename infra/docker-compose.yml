services:
  db:
    image: postgres:15-alpine
    container_name: vellvista-db
    environment:
      POSTGRES_DB: vellvista
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vellvista"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    container_name: vellvista-backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3001:3001"
    env_file:
      - ../backend/.env
    environment:
      SUPABASE_DB: postgresql://postgres.elkpsuvzmjblvyyturql:shubham123Sh%20@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres
      PORT: 3001
      SERVER_IP: localhost
      FRONTEND_URL: http://localhost:3000
      BETTER_AUTH_SECRET: dev_secret_key_which_is_at_least_32_characters_long
      BETTER_AUTH_URL: http://localhost:3001
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/backend/public

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=http://localhost:3001
    container_name: vellvista-frontend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
      INTERNAL_BACKEND_URL: http://backend:3001
      PORT: 3000
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: vellvista-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:2.9.2
    container_name: vellvista-loki
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/loki-config.yaml

  promtail:
    image: grafana/promtail:2.9.2
    container_name: vellvista-promtail
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: vellvista-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  backend_uploads:
  prometheus_data:
  loki_data:
  grafana_data:

